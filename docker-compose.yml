# =============================================
# 母婴垂直网站 - 新生产环境Docker Compose配置
# =============================================
# 版本：3.8
# 用途：使用traefik-net网络的新部署方案
# 特点：使用外部traefik-net网络、数据迁移支持
# 作者：Trae AI Assistant
# 日期：2024年12月
version: '3.8'

# =============================================
# 网络配置
# =============================================
networks:
  # 应用内部网络：用于服务间通信
  app-net:
    driver: bridge
  # Traefik网络：用于外部访问
  traefik-net:
    external: true  # 使用外部已存在的traefik-net网络

# =============================================
# 数据卷配置 - 新数据持久化
# =============================================
# 说明：使用新的命名卷持久化数据，与原数据分离
volumes:
  # PostgreSQL新数据持久化卷
  postgres_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/ubuntu/docker/data/postgres
  
  # Redis新数据持久化卷  
  redis_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/ubuntu/docker/data/redis

  # 后端新静态文件卷
  backend_static:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/ubuntu/docker/data/backend/static

# =============================================
# 服务定义
# =============================================

# =============================================
# PostgreSQL数据库服务
# =============================================
# 说明：PostgreSQL服务，使用traefik-net网络
# 注意：生产环境PostgreSQL配置
services:
  # PostgreSQL数据库服务
  postgres:
    # 使用官方PostgreSQL 15镜像
    image: postgres:15-alpine
    
    # 容器名称
    container_name: vertical_website_postgres
    
    # 网络配置：加入app-net网络
    networks:
      - app-net
    
    restart: unless-stopped
    
    # 端口映射：允许外部访问和应用连接
    # 使用标准PostgreSQL端口，允许外部网络访问
    ports:
      - "5432:5432"  # 允许所有IP访问PostgreSQL服务
    
    # 环境变量配置：与原服务保持相同的数据库配置
    environment:
      # 数据库基础配置（与原服务相同）
      POSTGRES_DB: vertical_website
      POSTGRES_USER: vertical_user
      
      # 安全：更新后的密码
      POSTGRES_PASSWORD: "1227Bing.."
      
      # PostgreSQL性能优化配置
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --locale=C"
      
      # 连接池配置
      PGDATA: /var/lib/postgresql/data/pgdata
      
      # 时区设置
      TZ: Asia/Shanghai
    
    # 挂载新数据卷：持久化存储
    volumes:
      # PostgreSQL数据目录
      - postgres_data:/var/lib/postgresql/data
      
      # 挂载配置文件（如需要自定义配置）
      # - ./config/postgresql.conf:/etc/postgresql/postgresql.conf:ro
    
    # 健康检查：确保数据库服务正常运行
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vertical_user -d vertical_website"]
      interval: 30s          # 检查间隔
      timeout: 10s           # 超时时间
      retries: 3             # 重试次数
      start_period: 40s      # 启动等待时间
    
    # 资源限制：防止资源耗尽
    deploy:
      resources:
        limits:
          # 内存限制：最大512MB
          memory: 512M
          # CPU限制：最大1核
          cpus: '1.0'
        reservations:
          # 内存保留：最小256MB
          memory: 256M
          # CPU保留：最小0.5核
          cpus: '0.5'
    
    # 日志配置
    logging:
      driver: "json-file"
      options:
        max-size: "10m"      # 单个日志文件最大10MB
        max-file: "3"        # 保留3个日志文件
    
    # 安全配置：临时注释掉以解决Nginx启动问题
    # security_opt:
    #   - no-new-privileges:true
    
    # 用户配置：以非root用户运行
    user: "999:999"

# =============================================
# Redis缓存服务  
# =============================================
# 说明：Redis服务，使用traefik-net网络
# 注意：生产环境Redis配置
  redis:
    # 使用官方Redis 7镜像
    image: redis:7-alpine
    
    # 容器名称
    container_name: vertical_website_redis
    
    # 网络配置：加入app-net网络
    networks:
      - app-net
    
    restart: unless-stopped
    
    # 端口映射：本地访问和应用连接
    # 本地Redis访问 - 使用临时端口避免与原服务冲突
    ports:
      - "127.0.0.1:6380:6379"  # 本地Redis访问（临时使用6380端口）
    
    # 环境变量配置：与原服务保持相同的配置
    environment:
      # Redis配置
      REDIS_PASSWORD: "1227Bing.."
      TZ: Asia/Shanghai
    
    # 挂载新数据卷
    volumes:
      # Redis数据目录
      - redis_data:/data
      
      # Redis配置文件（如需要自定义配置）
      # - ./config/redis.conf:/usr/local/etc/redis/redis.conf:ro
    
    # 启动命令：使用更新后的密码
    command: >
      redis-server 
      --requirepass "1227Bing.."
      --appendonly yes
      --appendfsync everysec
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --tcp-keepalive 300
      --timeout 0
    
    # 健康检查
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "1227Bing..", "--raw", "incr", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    
    # 资源限制
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
        reservations:
          memory: 128M
          cpus: '0.25'
    
    # 日志配置
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    
    # 安全配置
    security_opt:
      - no-new-privileges:true

# =============================================
# 后端API服务
# =============================================
# 说明：后端服务，使用traefik-net网络
# 注意：生产环境后端API配置
  backend:
    # 使用与原服务相同的镜像
    image: registry.cn-hangzhou.aliyuncs.com/meta-jiujiu/website_backend:latest
    
    # 容器名称
    container_name: vertical_website_backend
    
    # 网络配置：同时加入app-net和traefik-net网络
    networks:
      - app-net
      - traefik-net
    
    restart: unless-stopped
    
    # 端口映射：外部访问和应用连接
    # 外部访问端口
    ports:
      - "8000:8000"
    
    # 环境变量配置：与原服务保持相同，但连接到新的数据库服务
    environment:
      # 数据库连接配置：连接到postgres服务
      DATABASE_URL: "postgresql://vertical_user:1227Bing..@postgres:5432/vertical_website"
      
      # Redis连接配置：连接到redis服务
      REDIS_URL: "redis://:1227Bing..@redis:6379/0"
      
      # 应用基础配置（与原服务相同）
      APP_NAME: "vertical_website"
      APP_VERSION: "1.0.0"
      ENVIRONMENT: "production"
      DEBUG: "false"
      
      # 安全配置（与原服务相同）
      SECRET_KEY: "jPYi6JyGLk_N1kOG0zPk71yefH1KlWntFLD4_OjzFvQvU6MZ9ZFj-8OA5Ne3UhWlDAJ8Z4gcFj1WlHNSaccDPQ"
      ACCESS_TOKEN_EXPIRE_MINUTES: "30"
      
      # JWT配置（与原服务相同）
      JWT_ALGORITHM: "HS256"
      
      # API配置（与原服务相同）
      API_V1_STR: "/api"
      PROJECT_NAME: "母婴垂直网站"
      
      # CORS配置（根据前端域名调整）
      CORS_ORIGINS: "http://localhost:5173,http://localhost:3000,https://quzhinan.cn,https://backend.quzhinan.cn"
      
      # 文件上传配置（与原服务相同）
      UPLOAD_DIR: "/app/static"
      MAX_FILE_SIZE: "10485760"  # 10MB
      
      # 限流配置（与原服务相同）
      RATE_LIMIT_PER_MINUTE: "100"
      RATE_LIMIT_PER_HOUR: "1000"
      
      # 日志配置（与原服务相同）
      LOG_LEVEL: "INFO"
      LOG_FORMAT: "json"
      
      # 时区
      TZ: Asia/Shanghai
    
    # 服务依赖：确保新的数据库和Redis先启动
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    
    # 挂载新数据卷
    volumes:
      # 静态文件目录
      - backend_static:/app/static
      
      # 配置文件目录（如需要）
      # - ./config/backend:/app/config:ro
    
    # 健康检查
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    
    # 资源限制
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
        reservations:
          memory: 512M
          cpus: '0.5'
    
    # 日志配置
    logging:
      driver: "json-file"
      options:
        max-size: "50m"      # 单个日志文件最大50MB
        max-file: "5"        # 保留5个日志文件
    
    # 安全配置
    security_opt:
      - no-new-privileges:true
    
    # Traefik路由配置
    labels:
      # 启用Traefik路由
      - "traefik.enable=true"
      # 路由规则：所有/api前缀的请求路由到后端
      - "traefik.http.routers.backend.rule=Host(`backend.quzhinan.cn`) && PathPrefix(`/api`)"
      # 后端服务端口
      - "traefik.http.services.backend.loadbalancer.server.port=8000"
      # 使用traefik-net网络
      - "traefik.docker.network=traefik-net"
      # HTTPS配置：使用Let's Encrypt自动证书
      - "traefik.http.routers.backend-secure.tls=true"
      - "traefik.http.routers.backend-secure.tls.certresolver=letsencrypt"
      # HTTP到HTTPS重定向
      - "traefik.http.routers.backend-secure.rule=Host(`backend.quzhinan.cn`) && PathPrefix(`/api`)"
      - "traefik.http.routers.backend-secure.entrypoints=websecure" 

# =============================================
# 前端服务
# =============================================
# 说明：前端服务，使用traefik-net网络
# 注意：生产环境前端配置
  frontend:
    # 使用与原服务相同的镜像（假设前端镜像名称）
    image: registry.cn-hangzhou.aliyuncs.com/meta-jiujiu/website_frontend:latest
    
    # 容器名称
    container_name: vertical_website_frontend
    
    # 网络配置：同时加入app-net和traefik-net网络
    networks:
      - app-net
      - traefik-net
    
    restart: unless-stopped
    
    # 端口映射：外部访问和应用连接
    # 外部访问端口
    ports:
      - "8081:80"
    
    # 环境变量配置：与原服务保持相同，但连接到新的后端服务
    environment:
      # 后端API地址：连接到backend服务
      VITE_API_BASE_URL: "http://backend:8000/api"
      
      # 应用名称
      VITE_APP_NAME: "母婴垂直网站"
      
      # 分析配置（如需要）
      VITE_GOOGLE_ANALYTICS_ID: ""
      
      # 时区
      TZ: Asia/Shanghai

    # 挂载自定义Nginx配置文件
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./root.txt:/usr/share/nginx/html/root.txt:ro
    
    # 启动命令：直接启动Nginx
    command: nginx -g 'daemon off;'  
    
    # 健康检查
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    
    # 资源限制
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
        reservations:
          memory: 128M
          cpus: '0.25'
    
    # 日志配置
    logging:
      driver: "json-file"
      options:
        max-size: "10m"      # 单个日志文件最大10MB
        max-file: "3"        # 保留3个日志文件
    
    # 安全配置
    security_opt:
      - no-new-privileges:true
    
    # 用户配置：注释掉非root用户，使用默认root用户运行Nginx
    # user: "1000:1000"
    
    # Traefik路由配置
    labels:
      # 启用Traefik路由
      - "traefik.enable=true"
      # 路由规则：所有根路径请求路由到前端
      - "traefik.http.routers.frontend.rule=Host(`muying.quzhinan.cn`)"
      # 前端服务端口
      - "traefik.http.services.frontend.loadbalancer.server.port=80"
      # 使用traefik-net网络
      - "traefik.docker.network=traefik-net"
      # HTTPS配置：使用Let's Encrypt自动证书
      - "traefik.http.routers.frontend-secure.entrypoints=websecure"
      - "traefik.http.routers.frontend-secure.tls=true"
      - "traefik.http.routers.frontend-secure.tls.certresolver=letsencrypt"
      # HTTP到HTTPS重定向
      - "traefik.http.routers.frontend-secure.rule=Host(`muying.quzhinan.cn`)"

# =============================================
# 配置说明文档
# =============================================

# 使用方法：
# 1. 创建数据目录：mkdir -p /home/ubuntu/docker/data/{postgres,redis,backend/static}
# 2. 设置目录权限：chmod 755 /home/ubuntu/docker/data/{postgres,redis,backend/static}
# 3. 启动新服务：docker-compose -f docker-compose.new.yml up -d
# 4. 检查新服务状态：docker-compose -f docker-compose.new.yml ps
# 5. 查看新服务日志：docker-compose -f docker-compose.new.yml logs

# 数据迁移说明：
# 1. 备份原数据库：
#    - PostgreSQL：pg_dump -U vertical_user -d vertical_website -f /tmp/backup.sql
#    - Redis：redis-cli -a "2Hjh39%&94h" BGSAVE  # 注意：使用更新后的密码
# 2. 恢复到新数据库：
#    - PostgreSQL：psql -U vertical_user -d vertical_website -h localhost -p 5433 -f /tmp/backup.sql  # 注意：使用临时端口5433
#    - Redis：复制原Redis的dump.rdb文件到新Redis的数据目录

# 切换说明：
# 1. 确认数据迁移完成后，可将前端域名指向新的后端服务
# 2. 验证新服务正常运行后，可停止原服务
