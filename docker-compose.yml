version: '3.8'

services:
  # PostgreSQL 数据库
  postgres:
    image: postgres:15-alpine
    container_name: website_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: vertical_website
      POSTGRES_USER: vertical_user
      POSTGRES_PASSWORD: pg123456
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    networks:
      - website_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vertical_user -d vertical_website"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis 缓存
  redis:
    image: redis:7-alpine
    container_name: website_redis
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: redis123456
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    command: redis-server --requirepass redis123456
    networks:
      - website_network
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a redis123456 ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  # 后端服务
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.new
    container_name: website_backend
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql://vertical_user:pg123456@postgres:5432/vertical_website
      - REDIS_URL=redis://:redis123456@redis:6379/0
      - SECRET_KEY=your_production_secret_key_here_change_in_production
      - DEBUG=False
      - APP_ENV=production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    networks:
      - website_network
    volumes:
      - ./backend/static:/app/static:ro

  # 前端服务
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.new
    container_name: website_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    networks:
      - website_network
    depends_on:
      - backend

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  website_network:
    driver: bridge
    name: website_backend-net